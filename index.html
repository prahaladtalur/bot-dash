<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Copy-bot desk</title>
<style>
  :root { --bg:#05080d; --panel:#0a1019; --head:#0d1522; --line:#18263b; --line2:#101a2a; --ink:#d2dbe8; --muted:#6b7c95;
          --up:#2fe08a; --down:#ff4d5e; --warn:#ffd166; --accent:#ffb000;
          --mono:"Berkeley Mono","IBM Plex Mono","JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font:13px/1.45 var(--mono); }
  .num { font-variant-numeric:tabular-nums; }
  .up { color:var(--up); } .down { color:var(--down); } .muted { color:var(--muted); } .warn { color:var(--warn); }
  header { display:flex; flex-wrap:wrap; gap:6px 16px; align-items:center; padding:9px 14px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:13px; letter-spacing:.08em; color:var(--accent); }
  header .grow { flex:1; }
  .badge { border:1px solid var(--line); padding:1px 8px; white-space:nowrap; font-size:12px; }
  .badge.offline { border-color:var(--down); color:var(--down); font-weight:700; }
  .badge.live { border-color:var(--up); color:var(--up); }
  .tabs { display:flex; gap:1px; padding:8px 14px 0; flex-wrap:wrap; }
  .tabs button { font:inherit; color:var(--muted); background:var(--panel); border:1px solid var(--line); border-bottom:0; padding:5px 12px; cursor:pointer; }
  .tabs button[aria-selected="true"] { color:var(--ink); background:var(--head); border-color:var(--accent); }
  .tabs button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  main { display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); gap:8px; padding:8px 14px 24px; }
  section { background:var(--panel); border:1px solid var(--line); min-width:0; }
  section > h2 { margin:0; padding:5px 10px; font-size:11px; font-weight:600; letter-spacing:.08em; color:var(--accent);
                 background:var(--head); border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:10px; }
  section > h2 small { color:var(--muted); font-weight:400; letter-spacing:0; text-align:right; }
  .body { padding:10px; }
  .c12 { grid-column:span 12; } .c8 { grid-column:span 8; } .c6 { grid-column:span 6; } .c4 { grid-column:span 4; }
  .hero { display:grid; grid-template-columns:minmax(0,1.3fr) repeat(5,minmax(0,1fr)); }
  .hero > div { padding:10px 12px; border-right:1px solid var(--line); min-width:0; }
  .hero > div:last-child { border-right:0; }
  .k { font-size:10px; letter-spacing:.12em; color:var(--muted); }
  .v { font-size:20px; font-weight:700; white-space:nowrap; line-height:1.3; }
  .hero .big .v { font-size:34px; }
  .s { font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .scroll { overflow:auto; max-height:360px; }
  table { width:100%; border-collapse:collapse; }
  th { position:sticky; top:0; background:var(--panel); text-align:right; font-size:10px; font-weight:600; letter-spacing:.08em;
       color:var(--muted); padding:5px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th[data-sort] { cursor:pointer; } th[data-sort]:hover, th[aria-sort] { color:var(--ink); }
  td { text-align:right; padding:3px 8px; border-bottom:1px solid var(--line2); white-space:nowrap; }
  th:first-child, td:first-child, th.l, td.l { text-align:left; }
  .tag { border:1px solid var(--line); padding:0 5px; font-size:11px; }
  .tag.active { border-color:var(--up); color:var(--up); } .tag.rejected,.tag.decayed,.tag.paused { border-color:var(--down); color:var(--down); }
  .tag.watch { border-color:var(--warn); color:var(--warn); }
  .empty { padding:18px 10px; color:var(--muted); text-align:center; }
  .row { display:flex; justify-content:space-between; gap:10px; padding:3px 0; border-bottom:1px solid var(--line2); }
  .row:last-child { border-bottom:0; }
  .meter { height:8px; background:var(--line2); border:1px solid var(--line); margin:3px 0 8px; }
  .meter div { height:100%; background:var(--accent); max-width:100%; } .meter div.done { background:var(--up); } .meter div.hot { background:var(--down); }
  .chart { position:relative; height:260px; }
  footer { padding:0 14px 20px; color:var(--muted); font-size:11.5px; }
  footer b { color:var(--ink); font-weight:400; }
  @media (max-width:900px) { .c8,.c6,.c4 { grid-column:span 12; } .hero { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .hero > div { border-bottom:1px solid var(--line); } .hero .big { grid-column:span 2; } }
</style>
</head>
<body>
<header>
  <h1>COPY-BOT DESK</h1>
  <span class="badge" id="mode">--</span>
  <span class="badge" id="fresh">loading</span>
  <span class="grow"></span>
  <span class="muted" id="updated">--</span>
</header>
<div class="tabs" id="tabs" role="tablist" aria-label="Which bot"></div>

<main>
  <section class="c12"><div class="hero" id="hero"></div></section>

  <section class="c8"><h2>EQUITY CURVE <small id="curve-note">after fees, by closed trade</small></h2>
    <div class="body"><div class="chart"><canvas id="chart" role="img" aria-label="Equity over time, one line per bot and shadow book"></canvas></div></div></section>
  <section class="c4"><h2>KILL SWITCH <small>pause status</small></h2><div class="body" id="kill"></div></section>

  <section class="c8"><h2>OPEN POSITIONS <small id="pos-note"></small></h2><div class="scroll" id="positions"></div></section>
  <section class="c4"><h2>GO-LIVE GATE <small>all four needed</small></h2><div class="body" id="gate"></div></section>

  <section class="c8"><h2>LEADERS <small>our result copying each one, not theirs</small></h2><div class="scroll" id="leaders"></div></section>
  <section class="c4"><h2>HEALTH <small>bot process</small></h2><div class="body" id="health"></div></section>

  <section class="c12"><h2>RECENT TRADES <small>last 50, click a column to sort</small></h2><div class="scroll" id="trades"></div></section>
</main>

<footer id="foot"></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
